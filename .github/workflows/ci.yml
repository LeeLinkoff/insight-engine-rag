name: Backend Tests and Type Checks

# Runs on every push and pull request against main.
#
# Three jobs, in increasing order of what they actually require:
#   1. syntax-check   — plain JS files parse cleanly (node --check). No
#                        dependencies, no secrets, always runs.
#   2. typecheck       — the TypeScript versions (server.ts, evals.ts,
#                        highlight-safe.ts, swagger-spec.ts) compile clean
#                        under strict mode (npx tsc --noEmit). No secrets
#                        needed, this is a pure static check.
#   3. eval-harness     — boots the real server, ingests the content the
#                        eval test cases are written against, then runs
#                        evals.js end to end. Requires OPENAI_API_KEY as a
#                        repo secret, so it's skipped automatically on
#                        forked PRs (which never receive secrets) rather
#                        than failing loudly for external contributors.
#
# NOTE ON JOB 3: evals.js has one real regression test case grounded in
# actual ingested content (question + real source_id from a live ingest,
# not a placeholder), plus one refusal-case test. That's a genuine start,
# not a comprehensive suite, worth adding to over time as more content
# gets ingested and more question types get covered.
#
# Net effect:
#  * This job can catch a real regression in the one covered case (does
#    the known-fact question still get answered and cited correctly).
#  * It does not yet cover the breadth of your actual RAG logic, more
#    test cases are the way to close that gap, not a rewrite of this job.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax check (JS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check server.js parses
        run: node --check server.js

      - name: Check evals.js parses
        run: node --check evals.js

      - name: Check highlight-safe.js parses
        run: node --check highlight-safe.js

      - name: Check swagger-spec.js parses
        run: node --check swagger-spec.js

  typecheck:
    name: Type check (TypeScript, strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: tsc --noEmit
        # ============================================================
        # IMPORTANT: use --no-install, not plain `npx tsc --noEmit`.
        #
        # If TypeScript isn't actually resolvable locally (node_modules
        # missing/incomplete, wrong working directory, etc.), plain
        # `npx tsc` does NOT just fail with a clear error. It silently
        # falls back to searching the npm REGISTRY for any unrelated
        # package that happens to expose a command literally named
        # `tsc`, finds a totally different, unmaintained, years-old
        # package also called "tsc" (v2.0.4), installs THAT, and runs
        # it instead of your real TypeScript compiler:
        #
        #   npm warn exec The following package was not found and will
        #   be installed: tsc@2.0.4
        #   npm warn deprecated tsc@2.0.4: Package no longer supported.
        #   This is not the tsc command you are looking for
        #
        # This produces a confusing, unrelated failure that has nothing
        # to do with your actual TypeScript code, and wastes real time
        # debugging the wrong thing.
        #
        # --no-install forces npx to use ONLY the locally installed
        # package and fail loudly and clearly if it's missing, instead
        # of silently substituting a random registry package.
        # ============================================================
        run: npx --no-install tsc --noEmit

  eval-harness:
    name: Eval harness (live server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    needs: [syntax-check, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # GitHub Actions does not allow the `secrets` context in a job-level
      # `if:` condition (it's simply not evaluable at that stage, this is
      # a hard restriction, not a formatting issue). So the check happens
      # here instead, inside a step, where `secrets` IS accessible, and
      # the result is stored as a step output. Every step below that
      # needs the real key is gated on that output instead of on
      # `secrets` directly. This still fully skips the job's real work
      # on forked PRs (which never receive secrets) without the whole
      # job showing as skipped, individual steps just no-op.
      - name: Check for OPENAI_API_KEY
        id: check_key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "No OPENAI_API_KEY secret available (e.g. a forked PR). Skipping the eval harness steps below."
          fi

      - name: Install dependencies
        if: steps.check_key.outputs.has_key == 'true'
        run: npm install

      - name: Start server in background
        if: steps.check_key.outputs.has_key == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORT: 3001
        run: |
          nohup node server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server to become healthy
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3001/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat server.log
          exit 1

      # evals.js's "known_fact_in_store" test case expects a real, already-
      # ingested source (source_id url_9jZgqnjjV0uNjzFv, the deterministic
      # SHA-256 hash of this exact URL). A fresh CI server boots with an
      # empty store, so without this step every run of that test case would
      # fail, not because the code is broken, but because nothing was ever
      # loaded for it to answer from. This ingests the one page the test
      # case is actually written against.
      #
      # IMPORTANT: this step checks the actual response, not just the HTTP
      # status. GitHub's runner has a different network path to Wikipedia
      # than a home connection does (different IP, possible rate limiting,
      # different latency), so a silent ingest failure here would make the
      # eval harness fail in a way that looks exactly like a real logic
      # regression, when the actual cause is content never being loaded.
      # Failing loudly here, with the real response body printed, means a
      # future failure is diagnosable in seconds instead of looking like
      # a confusing false regression.
      - name: Ingest content for the eval harness
        if: steps.check_key.outputs.has_key == 'true'
        run: |
          RESPONSE=$(curl -s -X POST http://127.0.0.1:3001/api/ingest-urls \
            -H "Content-Type: application/json" \
            -d '{"urls":["https://en.wikipedia.org/wiki/Return_policy"]}')
          echo "Ingest response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "ERROR: Ingest did not return ok:true. Eval harness would run against an empty or incomplete store."
            exit 1
          fi
          CHUNKS=$(echo "$RESPONSE" | grep -oP '"chunks_added":\K[0-9]+')
          echo "Chunks added: $CHUNKS"
          if [ -z "$CHUNKS" ] || [ "$CHUNKS" -lt 1 ]; then
            echo "ERROR: chunks_added was 0 or missing. Ingest technically returned ok:true but added no content."
            exit 1
          fi

      - name: Run eval harness
        if: steps.check_key.outputs.has_key == 'true'
        env:
          EVAL_BASE_URL: http://127.0.0.1:3001
        run: node evals.js

      - name: Show server log on failure
        if: failure() && steps.check_key.outputs.has_key == 'true'
        run: cat server.log

      - name: Stop server
        if: always() && steps.check_key.outputs.has_key == 'true'
        run: kill "$(cat server.pid)" 2>/dev/null || true
